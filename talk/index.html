<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Talk with the model · Aceh NLP</title>
<meta name="theme-color" content="#0b4a52">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="stylesheet" href="/style.css">
</head>
<body class="tool">
<header class="topbar wrap">
  <a class="brand" href="/"><img src="/icon.svg" alt="" width="88" height="88"><span data-i18n="site.title">Aceh NLP</span></a>
  <nav>
    <a href="/" data-i18n="nav.home">About the project</a>
    <span id="lang-switch" class="lang-switch" role="group" aria-label="Language"></span>
  </nav>
</header>
<p id="draft-notice" class="notice wrap-notice" hidden data-i18n="draft.notice"></p>

<main class="wrap">
  <section>
    <h2 data-i18n="try.title">Talk with the model</h2>
    <p class="muted" data-i18n="try.note"></p>
    <p id="gen-offline" class="notice" hidden data-i18n="try.offline"></p>
    <form id="gen-form">
      <textarea id="gen-prompt" rows="3" data-i18n-placeholder="try.placeholder"></textarea>
      <button type="submit" id="gen-submit" data-i18n="try.submit">Send</button>
    </form>
    <pre id="gen-out" class="muted"></pre>
  </section>
</main>

<script src="/strings.js"></script>
<script src="/common.js"></script>
<script src="/talk.js"></script>
</body>
</html>
