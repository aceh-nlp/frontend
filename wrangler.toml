# Cloudflare Worker serving the static site, with /api/* forwarded to the backend.
name = "aceh-nlp-website"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Custom domains are created on deploy; both point at this Worker.
routes = [
  { pattern = "aceh-nlp.net", custom_domain = true },
  { pattern = "www.aceh-nlp.net", custom_domain = true },
]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

[vars]
# Backend origin; the dashboard can override this per environment.
API_ORIGIN = "https://aceh-evaluator.157-245-144-73.sslip.io"
